openapi: 3.0.3
info:
  title: KDS - Kitchen Display System API
  version: 1.0.0
  description: API para integração externa com o sistema KDS (Pedidos, status, listagem).
  contact:
    name: KDS Maintainers
    email: bruno.leao@solucaosistemas.net
servers:
  - url: http://localhost:8081
    description: Servidor da API (desenvolvimento)
paths:
  /orders:
    get:
      summary: Listar todos os pedidos
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Criar um novo pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}:
    get:
      summary: Obter detalhes de um pedido
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID do pedido
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Atualizar dados completos de um pedido
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
      responses:
        '200':
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remover um pedido
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pedido removido
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}/status:
    patch:
      summary: Atualizar status de um pedido
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Item:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
        - name
        - quantity

    Order:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        customerName:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        observations:
          type: string
          nullable: true
        status:
          type: string
          enum: [received, preparing, ready, delivered, cancelled]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - number
        - items

    NewOrder:
      type: object
      properties:
        number:
          type: integer
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        observations:
          type: string
      required:
        - number
        - items

    StatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [received, preparing, ready, delivered, cancelled]
      required:
        - status

    UpdateOrder:
      type: object
      properties:
        number:
          type: integer
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        observations:
          type: string
        status:
          type: string
          enum: [received, preparing, ready, delivered, cancelled]
      required:
        - number
        - customerName
        - items

    Error:
      type: object
      properties:
        error:
          type: string
